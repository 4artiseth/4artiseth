name: README build

on:
  push:
    branches:
      - main
  schedule:
    # Runs every day at 04:00 UTC — fully automatic, no manual trigger needed
    - cron: "0 4 * * *"
  workflow_dispatch:
    # Allows manual trigger from the Actions tab at any time

permissions:
  contents: write  # Required to commit and push the updated SVG files

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Kill the job if it hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r cache/requirements.txt

      - name: Update README SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit and push changes
        run: |
          git config --global user.email "github-actions-bot@4artiseth.github.io"
          git config --global user.name "4artiseth/GitHub-Actions-Bot"
          git add light_mode.svg dark_mode.svg
          git diff --cached --quiet || git commit -m "chore: auto-update README stats [skip ci]"
          git push
